<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Student Picker</title>
  <style>
    :root {
      --bg-1: #0f1a31;
      --bg-2: #1f355f;
      --panel: #ffffff;
      --ink: #12203a;
      --muted: #586789;
      --line: #d5def0;
      --brand: #1d61bf;
      --brand-soft: #e8f1ff;
      --ok-soft: #e7f6ee;
      --warn-soft: #fff1df;
      --danger-soft: #ffe9ed;
      --machine-top: #1f2e4c;
      --machine-bottom: #121d32;
      --gold-1: #ffc157;
      --gold-2: #ff9f2b;
      --reel-ink: #f6f8ff;
      --reel-muted: #b6c1da;
      --winner: #ffe6ae;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(255, 255, 255, 0.14), transparent 42%),
        radial-gradient(circle at 88% 80%, rgba(255, 196, 94, 0.2), transparent 38%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      padding: 14px;
    }

    .shell {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 10px 28px rgba(8, 17, 34, 0.22);
    }

    h1 {
      margin: 0 0 4px;
      color: #f5f8ff;
      font-size: 1.75rem;
      letter-spacing: 0.2px;
    }

    .intro {
      margin: 0;
      color: #d2ddf8;
      font-size: 0.95rem;
    }

    .setup-panel {
      overflow: hidden;
      max-height: 1000px;
      transition: max-height 0.35s ease, opacity 0.25s ease, padding 0.25s ease, margin 0.25s ease;
      opacity: 1;
    }

    .setup-collapsed .setup-panel {
      max-height: 0;
      opacity: 0;
      margin: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-width: 0;
      box-shadow: none;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field-wide { grid-column: 1 / -1; }

    label {
      font-size: 0.79rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.45px;
      font-weight: 700;
    }

    input, select, textarea, button {
      font: inherit;
    }

    input, select, textarea {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 11px;
      color: var(--ink);
      background: #fff;
    }

    input:focus, select:focus, textarea:focus {
      outline: 2px solid #dbe8ff;
      border-color: #8eaee4;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.32;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.03); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; filter: none; }

    .btn-primary { background: var(--brand); color: #fff; }
    .btn-soft { background: var(--brand-soft); color: var(--brand); border-color: #c6daf8; }
    .btn-ok { background: var(--ok-soft); color: #135833; border-color: #b5dec5; }
    .btn-warn { background: var(--warn-soft); color: #8b4a10; border-color: #f0d2a3; }
    .btn-danger { background: var(--danger-soft); color: #912637; border-color: #eebcca; }

    .draw-panel {
      padding: 10px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(240, 245, 255, 0.96));
    }

    .draw-topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .draw-title {
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 700;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(92px, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 8px 10px;
      text-align: center;
    }

    .stat .n {
      display: block;
      font-size: 1.4rem;
      font-weight: 800;
    }

    .stat .k {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.4px;
    }

    .machine-wrap {
      position: relative;
      border-radius: 16px;
      border: 1px solid #8ea2cc;
      background: linear-gradient(180deg, var(--machine-top), var(--machine-bottom));
      overflow: hidden;
      min-height: min(66vh, 560px);
      padding: 12px;
      box-shadow: inset 0 12px 20px rgba(255, 255, 255, 0.08), inset 0 -16px 22px rgba(0, 0, 0, 0.25);
    }

    .machine-wrap.spinning {
      animation: machinePulse 0.42s linear infinite;
    }

    @keyframes machinePulse {
      0%, 100% { box-shadow: inset 0 12px 20px rgba(255, 255, 255, 0.09), inset 0 -16px 22px rgba(0, 0, 0, 0.25), 0 0 0 rgba(255, 175, 66, 0.15); }
      50% { box-shadow: inset 0 12px 20px rgba(255, 255, 255, 0.18), inset 0 -16px 22px rgba(0, 0, 0, 0.25), 0 0 34px rgba(255, 175, 66, 0.34); }
    }

    .lights {
      position: absolute;
      inset: 6px;
      border-radius: 12px;
      pointer-events: none;
      border: 2px solid rgba(255, 187, 85, 0.35);
      box-shadow: 0 0 14px rgba(255, 180, 84, 0.4);
    }

    .machine-frame {
      position: absolute;
      inset: 42px 18px 74px;
      border-radius: 14px;
      border: 3px solid rgba(255, 193, 87, 0.62);
      background: linear-gradient(180deg, rgba(15, 24, 41, 0.96), rgba(6, 11, 21, 0.98));
      box-shadow: inset 0 18px 26px rgba(255, 255, 255, 0.05);
      overflow: hidden;
    }

    .reels {
      position: absolute;
      inset: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .reel {
      position: relative;
      border-radius: 10px;
      border: 1px solid rgba(149, 173, 222, 0.4);
      background: linear-gradient(180deg, #293d65, #192743);
      overflow: hidden;
    }

    .reel-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      will-change: transform;
    }

    .reel-item {
      height: 64px;
      display: grid;
      place-items: center;
      color: var(--reel-ink);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.2px;
      padding: 0 8px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .reel-mask-top,
    .reel-mask-bottom {
      position: absolute;
      left: 0;
      right: 0;
      height: 70px;
      pointer-events: none;
      z-index: 3;
    }

    .reel-mask-top {
      top: 0;
      background: linear-gradient(180deg, rgba(9, 14, 25, 0.98), rgba(9, 14, 25, 0));
    }

    .reel-mask-bottom {
      bottom: 0;
      background: linear-gradient(0deg, rgba(9, 14, 25, 0.98), rgba(9, 14, 25, 0));
    }

    .center-line {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      height: 70px;
      border-radius: 9px;
      border: 2px solid rgba(255, 201, 112, 0.95);
      box-shadow: 0 0 16px rgba(255, 188, 78, 0.38), inset 0 0 12px rgba(255, 200, 111, 0.16);
      pointer-events: none;
      z-index: 4;
    }

    .winner-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 6;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .winner-overlay.on { opacity: 1; }

    .winner-name {
      max-width: 86%;
      text-align: center;
      color: var(--winner);
      text-shadow: 0 0 18px rgba(255, 195, 91, 0.65), 0 0 45px rgba(255, 195, 91, 0.35);
      font-size: clamp(2rem, 6vw, 4.8rem);
      font-weight: 900;
      line-height: 1.03;
      letter-spacing: 0.45px;
      transform: scale(0.86);
      opacity: 0;
    }

    .winner-overlay.on .winner-name {
      animation: winnerPop 0.55s cubic-bezier(.18, .84, .25, 1);
      opacity: 1;
      transform: scale(1);
    }

    @keyframes winnerPop {
      0% { transform: scale(0.7); opacity: 0; }
      55% { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    #celebration-canvas {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .controls {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    #status {
      margin-top: 8px;
      color: #f4f7ff;
      font-size: 0.95rem;
      font-weight: 700;
      min-height: 24px;
      text-align: center;
      letter-spacing: 0.2px;
    }

    .prompt {
      margin-top: 8px;
      border: 1px solid #f2d8ad;
      border-radius: 10px;
      background: #fff5e8;
      color: #915317;
      padding: 10px;
      display: none;
    }

    .prompt.on { display: block; }

    #toast {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.88rem;
      min-height: 20px;
    }

    @media (max-width: 900px) {
      .form-grid { grid-template-columns: 1fr; }
      .machine-wrap { min-height: min(70vh, 620px); }
      .machine-frame { inset: 40px 10px 90px; }
      .reels { gap: 8px; inset: 16px 10px; }
      .reel-item { font-size: 0.95rem; }
      .center-line { left: 10px; right: 10px; }
      .controls { justify-content: center; }
      .draw-topbar { justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      .machine-wrap.spinning { animation: none; }
      .winner-overlay.on .winner-name { animation-duration: 0.2s; }
      .display-sheen { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell" id="app-shell">
    <section>
      <h1>Random Student Picker</h1>
      <p class="intro">Client-side only. Names stay in this browser unless you export a JSON backup.</p>
    </section>

    <section class="panel setup-panel" id="setup-panel">
      <div class="form-grid">
        <div class="field">
          <label for="class-select">Saved Classlists</label>
          <select id="class-select"></select>
        </div>

        <div class="field">
          <label for="class-name">Class Name</label>
          <input id="class-name" type="text" maxlength="80" placeholder="Year 9 Science - Period 2">
        </div>

        <div class="field field-wide">
          <label for="class-names">Student Names (one per line)</label>
          <textarea id="class-names" placeholder="Alex Tan&#10;Riley Jones&#10;Jordan Singh"></textarea>
        </div>

        <div class="field field-wide">
          <div class="toolbar">
            <button id="save-class" class="btn-primary">Save / Update</button>
            <button id="delete-class" class="btn-danger">Delete Classlist</button>
            <button id="import-json" class="btn-soft">Import JSON</button>
            <button id="export-json" class="btn-soft">Export JSON</button>
            <button id="hide-setup" class="btn-soft">Hide Setup</button>
          </div>
        </div>
      </div>
    </section>

    <section class="panel draw-panel">
      <div class="draw-topbar">
        <div class="draw-title" id="draw-title">No classlist selected</div>
        <button id="toggle-setup" class="btn-soft">Edit Classlists</button>
      </div>

      <div class="stats">
        <div class="stat"><span class="n" id="total-count">0</span><span class="k">Total</span></div>
        <div class="stat"><span class="n" id="remaining-count">0</span><span class="k">Remaining</span></div>
        <div class="stat"><span class="n" id="removed-count">0</span><span class="k">Removed</span></div>
      </div>

      <div class="machine-wrap" id="machine-wrap">
        <div class="lights"></div>
        <div class="machine-frame" id="machine-frame">
          <div class="reels">
            <div class="reel">
              <div class="reel-track" id="reel-track-0"></div>
              <div class="reel-mask-top"></div>
              <div class="reel-mask-bottom"></div>
            </div>
            <div class="reel">
              <div class="reel-track" id="reel-track-1"></div>
              <div class="reel-mask-top"></div>
              <div class="reel-mask-bottom"></div>
            </div>
            <div class="reel">
              <div class="reel-track" id="reel-track-2"></div>
              <div class="reel-mask-top"></div>
              <div class="reel-mask-bottom"></div>
            </div>
          </div>
          <div class="center-line"></div>
          <canvas id="celebration-canvas"></canvas>
          <div class="winner-overlay" id="winner-overlay">
            <div class="winner-name" id="winner-name"></div>
          </div>
        </div>
        <div id="status">Load or create a classlist to start.</div>
      </div>

      <div class="controls">
        <button id="pick-button" class="btn-primary">Spin and Pick</button>
        <button id="return-button" class="btn-ok" disabled>Return to Pool</button>
        <button id="remove-button" class="btn-warn" disabled>Remove from Pool</button>
        <button id="reset-pool" class="btn-soft">Reset Pool</button>
      </div>

      <div class="prompt" id="empty-prompt">
        <div>Pool is empty. Reset from this classlist to continue?</div>
        <div class="controls">
          <button id="prompt-reset" class="btn-primary">Reset Pool Now</button>
        </div>
      </div>

      <div id="toast"></div>
    </section>
  </main>

  <input type="file" id="json-file" accept="application/json,.json" style="display:none">

  <script>
    'use strict';

    const STORAGE_KEY = 'classroomTools.randomStudentPicker.v1';
    const EXPORT_VERSION = 1;
    const REEL_ITEM_HEIGHT = 64;
    const REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const state = {
      classlists: {},
      selectedClass: '',
      sourceNames: [],
      activePool: [],
      pendingPick: null,
      pendingRemoved: false,
      isAnimating: false,
      setupCollapsed: false,
      reelAnimation: null,
      celebrationRaf: null
    };

    const el = {
      shell: document.getElementById('app-shell'),
      setupPanel: document.getElementById('setup-panel'),
      classSelect: document.getElementById('class-select'),
      className: document.getElementById('class-name'),
      classNames: document.getElementById('class-names'),
      saveClass: document.getElementById('save-class'),
      deleteClass: document.getElementById('delete-class'),
      importJson: document.getElementById('import-json'),
      exportJson: document.getElementById('export-json'),
      hideSetup: document.getElementById('hide-setup'),
      toggleSetup: document.getElementById('toggle-setup'),
      drawTitle: document.getElementById('draw-title'),
      totalCount: document.getElementById('total-count'),
      remainingCount: document.getElementById('remaining-count'),
      removedCount: document.getElementById('removed-count'),
      machineWrap: document.getElementById('machine-wrap'),
      status: document.getElementById('status'),
      pickButton: document.getElementById('pick-button'),
      returnButton: document.getElementById('return-button'),
      removeButton: document.getElementById('remove-button'),
      resetPool: document.getElementById('reset-pool'),
      promptReset: document.getElementById('prompt-reset'),
      emptyPrompt: document.getElementById('empty-prompt'),
      toast: document.getElementById('toast'),
      winnerOverlay: document.getElementById('winner-overlay'),
      winnerName: document.getElementById('winner-name'),
      reelTracks: [
        document.getElementById('reel-track-0'),
        document.getElementById('reel-track-1'),
        document.getElementById('reel-track-2')
      ],
      canvas: document.getElementById('celebration-canvas'),
      jsonFile: document.getElementById('json-file')
    };

    function showToast(message) {
      el.toast.textContent = message;
    }

    function normalizeName(name) {
      return String(name || '').trim().replace(/\s+/g, ' ');
    }

    function parseNames(text) {
      const lines = String(text || '').split(/\r?\n/).map(normalizeName).filter(Boolean);
      const out = [];
      const seen = new Set();
      for (const line of lines) {
        const key = line.toLowerCase();
        if (seen.has(key)) continue;
        seen.add(key);
        out.push(line);
      }
      return out;
    }

    function pairKey(a, b) {
      return a.toLowerCase() < b.toLowerCase() ? `${a}__${b}` : `${b}__${a}`;
    }

    function normalizeLockPairs(rawPairs, validNames) {
      if (!Array.isArray(rawPairs) || !validNames.length) return [];
      const lookup = new Map();
      for (const name of validNames) {
        lookup.set(name.toLowerCase(), name);
      }
      const out = [];
      const seen = new Set();
      for (const pair of rawPairs) {
        if (!Array.isArray(pair) || pair.length < 2) continue;
        const aRaw = normalizeName(pair[0]);
        const bRaw = normalizeName(pair[1]);
        if (!aRaw || !bRaw) continue;
        const a = lookup.get(aRaw.toLowerCase());
        const b = lookup.get(bRaw.toLowerCase());
        if (!a || !b || a === b) continue;
        const key = pairKey(a, b);
        if (seen.has(key)) continue;
        seen.add(key);
        out.push([a, b]);
      }
      return out;
    }

    function saveStorage() {
      const payload = {
        version: EXPORT_VERSION,
        selectedClass: state.selectedClass,
        classlists: state.classlists,
        setupCollapsed: state.setupCollapsed
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }

    function loadStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return;
        if (parsed.classlists && typeof parsed.classlists === 'object') {
          state.classlists = parsed.classlists;
        }
        if (typeof parsed.selectedClass === 'string') {
          state.selectedClass = parsed.selectedClass;
        }
        if (typeof parsed.setupCollapsed === 'boolean') {
          state.setupCollapsed = parsed.setupCollapsed;
        }
      } catch (_err) {
        showToast('Could not read saved classlists.');
      }
    }

    function getClassNames() {
      return Object.keys(state.classlists).sort((a, b) => a.localeCompare(b));
    }

    function renderClassSelect() {
      const names = getClassNames();
      el.classSelect.innerHTML = '';

      if (!names.length) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'No classlists saved yet';
        el.classSelect.appendChild(opt);
        el.classSelect.disabled = true;
        state.selectedClass = '';
        state.sourceNames = [];
        state.activePool = [];
        state.pendingPick = null;
        state.pendingRemoved = false;
        return;
      }

      el.classSelect.disabled = false;
      for (const name of names) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        el.classSelect.appendChild(opt);
      }

      if (!names.includes(state.selectedClass)) {
        state.selectedClass = names[0];
      }
      el.classSelect.value = state.selectedClass;
    }

    function setSetupCollapsed(collapsed) {
      state.setupCollapsed = Boolean(collapsed);
      el.shell.classList.toggle('setup-collapsed', state.setupCollapsed);
      el.toggleSetup.textContent = state.setupCollapsed ? 'Edit Classlists' : 'Hide Setup';
      saveStorage();
    }

    function loadSelectedClass(resetPool) {
      const className = state.selectedClass;
      const entry = state.classlists[className];
      state.pendingPick = null;
      state.pendingRemoved = false;
      stopWinnerOverlay();

      if (!entry) {
        el.className.value = '';
        el.classNames.value = '';
        state.sourceNames = [];
        state.activePool = [];
        updateView();
        return;
      }

      const names = Array.isArray(entry.names) ? entry.names.map(normalizeName).filter(Boolean) : [];
      state.sourceNames = names;
      el.className.value = className;
      el.classNames.value = names.join('\n');

      if (resetPool || !state.activePool.length) {
        state.activePool = [...names];
      } else {
        state.activePool = state.activePool.filter((n) => names.includes(n));
      }

      if (names.length) {
        setSetupCollapsed(true);
      }

      buildIdleReels();
      updateView();
    }

    function updateStats() {
      const total = state.sourceNames.length;
      const pendingOffset = state.pendingRemoved ? 1 : 0;
      const removed = Math.max(0, total - state.activePool.length - pendingOffset);
      el.totalCount.textContent = String(total);
      el.remainingCount.textContent = String(state.activePool.length);
      el.removedCount.textContent = String(removed);
    }

    function updateButtons() {
      const hasClass = Boolean(state.selectedClass && state.sourceNames.length);
      const hasPool = state.activePool.length > 0;
      const hasPending = Boolean(state.pendingPick);

      el.pickButton.disabled = state.isAnimating || !hasPool || hasPending;
      el.returnButton.disabled = state.isAnimating || !hasPending;
      el.removeButton.disabled = state.isAnimating || !hasPending;
      el.resetPool.disabled = state.isAnimating || !hasClass;
      el.promptReset.disabled = state.isAnimating || !hasClass;
      el.deleteClass.disabled = state.isAnimating || !state.selectedClass;
      el.exportJson.disabled = state.isAnimating || !getClassNames().length;
      el.importJson.disabled = state.isAnimating;
      el.saveClass.disabled = state.isAnimating;
      el.classSelect.disabled = state.isAnimating || !getClassNames().length;
      el.hideSetup.disabled = state.isAnimating;
      el.toggleSetup.disabled = state.isAnimating;
      el.emptyPrompt.classList.toggle('on', hasClass && !hasPool && !hasPending && !state.isAnimating);
    }

    function updateView() {
      updateStats();
      updateButtons();

      if (!state.selectedClass) {
        el.drawTitle.textContent = 'No classlist selected';
      } else {
        el.drawTitle.textContent = `Classlist: ${state.selectedClass}`;
      }

      if (state.isAnimating) {
        el.status.textContent = 'Spinning...';
        el.machineWrap.classList.add('spinning');
        return;
      }

      el.machineWrap.classList.remove('spinning');

      if (state.pendingPick) {
        el.status.textContent = 'Choose whether to return this name or remove it.';
        return;
      }

      if (!state.selectedClass) {
        el.status.textContent = 'Load or create a classlist to start.';
        return;
      }

      if (!state.activePool.length) {
        el.status.textContent = 'Pool empty. Reset to start a new round.';
        return;
      }

      el.status.textContent = 'Press Spin and Pick.';
    }

    function randomFromPool() {
      const i = Math.floor(Math.random() * state.activePool.length);
      return state.activePool[i];
    }

    function buildReelItems(finalName, reelIndex) {
      const count = 58;
      const targetIndex = 46 + reelIndex;
      const names = state.activePool.length ? state.activePool : ['Ready'];
      const items = [];

      for (let i = 0; i < count; i += 1) {
        const r = Math.floor(Math.random() * names.length);
        items.push(names[r]);
      }

      items[targetIndex] = finalName;
      return { items, targetIndex };
    }

    function renderReel(track, items) {
      track.innerHTML = '';
      const frag = document.createDocumentFragment();
      for (const text of items) {
        const row = document.createElement('div');
        row.className = 'reel-item';
        row.textContent = text;
        frag.appendChild(row);
      }
      track.appendChild(frag);
    }

    function getReelViewportHeight() {
      const reel = el.reelTracks[0] ? el.reelTracks[0].parentElement : null;
      return reel ? reel.clientHeight : 220;
    }

    function centerOffsetForIndex(index, viewportHeight) {
      return (index * REEL_ITEM_HEIGHT) - ((viewportHeight / 2) - (REEL_ITEM_HEIGHT / 2));
    }

    function buildIdleReels() {
      const names = state.activePool.length ? state.activePool : (state.sourceNames.length ? state.sourceNames : ['Ready']);
      const viewportHeight = getReelViewportHeight();
      for (const track of el.reelTracks) {
        const items = [];
        for (let i = 0; i < 18; i += 1) {
          items.push(names[i % names.length]);
        }
        renderReel(track, items);
        const offset = centerOffsetForIndex(8, viewportHeight);
        track.style.transform = `translateY(${-offset}px)`;
      }
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function stopWinnerOverlay() {
      el.winnerOverlay.classList.remove('on');
      el.winnerName.textContent = '';
    }

    function showWinnerOverlay(name) {
      el.winnerName.textContent = name;
      el.winnerOverlay.classList.add('on');
    }

    function stopCelebration() {
      if (state.celebrationRaf) {
        cancelAnimationFrame(state.celebrationRaf);
        state.celebrationRaf = null;
      }
      const ctx = el.canvas.getContext('2d');
      ctx.clearRect(0, 0, el.canvas.width, el.canvas.height);
    }

    function resizeCelebrationCanvas() {
      const rect = el.machineFrameRect || document.getElementById('machine-frame').getBoundingClientRect();
      el.canvas.width = Math.max(10, Math.floor(rect.width));
      el.canvas.height = Math.max(10, Math.floor(rect.height));
    }

    function runCelebration() {
      resizeCelebrationCanvas();
      stopCelebration();

      if (REDUCE_MOTION) {
        return;
      }

      const ctx = el.canvas.getContext('2d');
      const w = el.canvas.width;
      const h = el.canvas.height;
      const colors = ['#ffd166', '#ef476f', '#06d6a0', '#118ab2', '#ffe66d', '#ff8fab'];
      const particles = [];

      function spawnBurst(x, y, amount) {
        for (let i = 0; i < amount; i += 1) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 5;
          particles.push({
            kind: 'spark',
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0,
            maxLife: 48 + Math.random() * 26,
            size: 1.5 + Math.random() * 2.2,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }
      }

      for (let i = 0; i < 60; i += 1) {
        particles.push({
          kind: 'confetti',
          x: Math.random() * w,
          y: -10 - Math.random() * h * 0.25,
          vx: -1.2 + Math.random() * 2.4,
          vy: 1.4 + Math.random() * 2.8,
          life: 0,
          maxLife: 100 + Math.random() * 50,
          size: 4 + Math.random() * 5,
          rot: Math.random() * Math.PI,
          vr: -0.2 + Math.random() * 0.4,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }

      spawnBurst(w * 0.25, h * 0.36, 46);
      spawnBurst(w * 0.5, h * 0.24, 60);
      spawnBurst(w * 0.75, h * 0.36, 46);

      let frame = 0;
      const maxFrames = 120;

      function tick() {
        frame += 1;
        ctx.clearRect(0, 0, w, h);

        for (let i = particles.length - 1; i >= 0; i -= 1) {
          const p = particles[i];
          p.life += 1;
          if (p.life > p.maxLife) {
            particles.splice(i, 1);
            continue;
          }

          if (p.kind === 'spark') {
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.985;
            p.vy *= 0.985;
            p.vy += 0.02;
            const alpha = 1 - (p.life / p.maxLife);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
          } else {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.018;
            p.rot += p.vr;
            const alpha = Math.max(0, 1 - (p.life / p.maxLife));
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.55);
            ctx.restore();
            ctx.globalAlpha = 1;
          }
        }

        if (frame < maxFrames && particles.length) {
          state.celebrationRaf = requestAnimationFrame(tick);
        } else {
          state.celebrationRaf = null;
          ctx.clearRect(0, 0, w, h);
        }
      }

      state.celebrationRaf = requestAnimationFrame(tick);
    }

    function animateReels(finalName) {
      stopWinnerOverlay();
      stopCelebration();

      const reels = [];
      const baseDuration = REDUCE_MOTION ? 1200 : 2900;

      for (let i = 0; i < 3; i += 1) {
        const { items, targetIndex } = buildReelItems(finalName, i);
        const track = el.reelTracks[i];
        renderReel(track, items);

        const viewportHeight = getReelViewportHeight();
        const startIndex = 3 + i;
        const startOffset = centerOffsetForIndex(startIndex, viewportHeight);
        const endOffset = centerOffsetForIndex(targetIndex, viewportHeight);
        track.style.transform = `translateY(${-startOffset}px)`;

        reels.push({
          track,
          startOffset,
          endOffset,
          delay: REDUCE_MOTION ? i * 70 : i * 180,
          duration: baseDuration + i * (REDUCE_MOTION ? 80 : 220)
        });
      }

      state.isAnimating = true;
      state.pendingPick = null;
      state.pendingRemoved = false;
      updateView();

      const startTime = performance.now();

      function step(now) {
        let completed = 0;

        for (const reel of reels) {
          const elapsed = now - startTime - reel.delay;
          if (elapsed <= 0) {
            reel.track.style.transform = `translateY(${-reel.startOffset}px)`;
            continue;
          }

          const p = Math.min(1, elapsed / reel.duration);
          const eased = easeOutCubic(p);
          const offset = reel.startOffset + (reel.endOffset - reel.startOffset) * eased;
          reel.track.style.transform = `translateY(${-offset}px)`;
          if (p >= 1) completed += 1;
        }

        if (completed === reels.length) {
          state.isAnimating = false;
          state.pendingPick = finalName;
          const idx = state.activePool.indexOf(finalName);
          if (idx >= 0) {
            state.activePool.splice(idx, 1);
            state.pendingRemoved = true;
          }
          showWinnerOverlay(finalName);
          runCelebration();
          updateView();
          return;
        }

        state.reelAnimation = requestAnimationFrame(step);
      }

      state.reelAnimation = requestAnimationFrame(step);
    }

    function pickRandomStudent() {
      if (state.isAnimating || state.pendingPick) return;
      if (!state.activePool.length) {
        showToast('Pool is empty. Reset to continue.');
        updateView();
        return;
      }
      const finalName = randomFromPool();
      animateReels(finalName);
    }

    function returnToPool() {
      if (!state.pendingPick) return;
      if (state.pendingRemoved) {
        state.activePool.push(state.pendingPick);
      }
      showToast(`${state.pendingPick} returned to pool.`);
      state.pendingPick = null;
      state.pendingRemoved = false;
      stopWinnerOverlay();
      buildIdleReels();
      updateView();
    }

    function removeFromPool() {
      if (!state.pendingPick) return;
      const name = state.pendingPick;
      state.pendingPick = null;
      state.pendingRemoved = false;
      stopWinnerOverlay();
      buildIdleReels();
      showToast(`${name} removed from pool.`);
      updateView();
    }

    function resetPool() {
      state.activePool = [...state.sourceNames];
      state.pendingPick = null;
      state.pendingRemoved = false;
      stopWinnerOverlay();
      buildIdleReels();
      showToast('Pool reset from classlist.');
      updateView();
    }

    function saveOrUpdateClass() {
      const className = normalizeName(el.className.value);
      const names = parseNames(el.classNames.value);

      if (!className) {
        showToast('Enter a class name first.');
        return;
      }
      if (!names.length) {
        showToast('Enter at least one student name.');
        return;
      }

      const existing = state.classlists[className] || {};
      state.classlists[className] = {
        names,
        lockPairs: normalizeLockPairs(existing.lockPairs, names),
        updatedAt: new Date().toISOString()
      };
      state.selectedClass = className;
      renderClassSelect();
      loadSelectedClass(true);
      setSetupCollapsed(true);
      saveStorage();
      showToast(`Saved "${className}" with ${names.length} students.`);
    }

    function deleteClass() {
      if (!state.selectedClass) return;
      const name = state.selectedClass;
      const ok = window.confirm(`Delete classlist "${name}"?`);
      if (!ok) return;

      delete state.classlists[name];
      state.activePool = [];
      state.pendingPick = null;
      state.pendingRemoved = false;
      stopWinnerOverlay();

      renderClassSelect();
      loadSelectedClass(true);
      if (!getClassNames().length) {
        setSetupCollapsed(false);
      }
      saveStorage();
      buildIdleReels();
      showToast(`Deleted "${name}".`);
    }

    function makeExportPayload() {
      const names = getClassNames();
      return {
        version: EXPORT_VERSION,
        exportedAt: new Date().toISOString(),
        classlists: names.map((className) => ({
          className,
          names: state.classlists[className].names,
          ...(Array.isArray(state.classlists[className].lockPairs) && state.classlists[className].lockPairs.length
            ? { lockPairs: state.classlists[className].lockPairs }
            : {})
        }))
      };
    }

    function exportJson() {
      const payload = makeExportPayload();
      const fileName = `classlists-${new Date().toISOString().slice(0, 10)}.json`;
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(url);
      showToast(`Exported ${payload.classlists.length} classlists.`);
    }

    function collectImportClasslists(parsed) {
      const out = {};
      let skipped = 0;

      function addList(className, names, lockPairsRaw) {
        const cleanClassName = normalizeName(className);
        if (!cleanClassName) {
          skipped += 1;
          return;
        }
        const cleanNames = Array.isArray(names) ? names.map(normalizeName).filter(Boolean) : [];
        const unique = [];
        const seen = new Set();
        for (const student of cleanNames) {
          const key = student.toLowerCase();
          if (seen.has(key)) continue;
          seen.add(key);
          unique.push(student);
        }
        if (!unique.length) {
          skipped += 1;
          return;
        }
        out[cleanClassName] = {
          names: unique,
          lockPairs: normalizeLockPairs(lockPairsRaw, unique),
          updatedAt: new Date().toISOString()
        };
      }

      if (parsed && Array.isArray(parsed.classlists)) {
        for (const entry of parsed.classlists) {
          if (!entry || typeof entry !== 'object') {
            skipped += 1;
            continue;
          }
          addList(entry.className, entry.names, entry.lockPairs);
        }
      } else if (parsed && parsed.classlists && typeof parsed.classlists === 'object') {
        for (const [className, entry] of Object.entries(parsed.classlists)) {
          const names = entry && typeof entry === 'object' ? entry.names : null;
          const lockPairs = entry && typeof entry === 'object' ? entry.lockPairs : null;
          addList(className, names, lockPairs);
        }
      } else if (parsed && typeof parsed === 'object') {
        for (const [className, maybeNames] of Object.entries(parsed)) {
          if (!Array.isArray(maybeNames)) {
            skipped += 1;
            continue;
          }
          addList(className, maybeNames, null);
        }
      }

      return { imported: out, skipped };
    }

    async function importJsonFile(file) {
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        const { imported, skipped } = collectImportClasslists(parsed);
        const incoming = Object.keys(imported);
        if (!incoming.length) {
          showToast('No valid classlists found in this file.');
          return;
        }

        let overwritten = 0;
        let added = 0;
        for (const className of incoming) {
          if (state.classlists[className]) overwritten += 1;
          else added += 1;
          state.classlists[className] = imported[className];
        }

        state.selectedClass = incoming[0];
        renderClassSelect();
        loadSelectedClass(true);
        setSetupCollapsed(true);
        saveStorage();
        showToast(`Import complete: ${added} added, ${overwritten} overwritten, ${skipped} skipped.`);
      } catch (_err) {
        showToast('Import failed. Please choose a valid JSON file.');
      }
    }

    function wireEvents() {
      el.saveClass.addEventListener('click', saveOrUpdateClass);
      el.deleteClass.addEventListener('click', deleteClass);
      el.importJson.addEventListener('click', () => el.jsonFile.click());
      el.exportJson.addEventListener('click', exportJson);
      el.hideSetup.addEventListener('click', () => setSetupCollapsed(true));
      el.toggleSetup.addEventListener('click', () => setSetupCollapsed(!state.setupCollapsed));

      el.pickButton.addEventListener('click', pickRandomStudent);
      el.returnButton.addEventListener('click', returnToPool);
      el.removeButton.addEventListener('click', removeFromPool);
      el.resetPool.addEventListener('click', resetPool);
      el.promptReset.addEventListener('click', resetPool);

      el.classSelect.addEventListener('change', () => {
        state.selectedClass = el.classSelect.value;
        loadSelectedClass(true);
        saveStorage();
      });

      el.jsonFile.addEventListener('change', async (event) => {
        const input = event.target;
        const file = input.files && input.files[0];
        if (!file) return;
        await importJsonFile(file);
        input.value = '';
      });

      window.addEventListener('resize', () => {
        resizeCelebrationCanvas();
      });
    }

    function init() {
      loadStorage();
      renderClassSelect();
      loadSelectedClass(true);
      wireEvents();

      setSetupCollapsed(state.sourceNames.length ? state.setupCollapsed : false);

      buildIdleReels();
      updateView();
    }

    init();
  </script>
</body>
</html>
